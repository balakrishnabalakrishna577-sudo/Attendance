{% extends "attendance/hod/base_hod.html" %}
{% block title %}{{ action }} Student{% endblock %}
{% block page_title %}{{ action }} Student{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{{ action }} Student</h1>
  <a href="{% url 'student_list' %}" class="btn-primary-custom" style="background:#64748b;">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</div>

<div class="form-card">
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label-custom">Roll Number <span class="text-danger">*</span></label>
      <input type="text" name="roll_number" class="form-control-custom"
             value="{{ student.roll_number|default:'' }}" required placeholder="e.g. 01">
    </div>
    <div class="mb-3">
      <label class="form-label-custom">Student Name <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control-custom"
             value="{{ student.name|default:'' }}" required placeholder="Full name">
    </div>
    <div class="mb-4">
      <label class="form-label-custom">Class <span class="text-danger">*</span></label>
      <select name="class_id" class="form-control-custom form-select-custom" required>
        <option value="">— Select Class —</option>
        {% for cls in classes %}
        <option value="{{ cls.id }}"
          {% if student.class_id == cls.id %}selected{% endif %}>
          {{ cls.name }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn-primary-custom">
        <i class="bi bi-check-lg"></i> {{ action }} Student
      </button>
      <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
