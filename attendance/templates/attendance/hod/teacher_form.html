{% extends "attendance/hod/base_hod.html" %}
{% block title %}{{ action }} Teacher{% endblock %}
{% block page_title %}{{ action }} Teacher{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{{ action }} Teacher</h1>
  <a href="{% url 'teacher_list' %}" class="btn-primary-custom"
     style="background:var(--gray-500);">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</div>

<div class="form-card">
  <form method="post" novalidate>
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label-custom">Full Name <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control-custom"
             value="{{ teacher.name|default:'' }}" required
             placeholder="e.g. Dr. Priya Sharma">
    </div>

    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label class="form-label-custom">Email</label>
        <input type="email" name="email" class="form-control-custom"
               value="{{ teacher.email|default:'' }}"
               placeholder="teacher@college.edu">
      </div>
      <div class="col-sm-6">
        <label class="form-label-custom">Phone</label>
        <input type="text" name="phone" class="form-control-custom"
               value="{{ teacher.phone|default:'' }}"
               placeholder="9XXXXXXXXX">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label-custom">Department</label>
      <input type="text" name="department" class="form-control-custom"
             value="{{ teacher.department|default:'' }}"
             placeholder="e.g. Computer Science">
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn-primary-custom">
        <i class="bi bi-check-lg"></i> {{ action }} Teacher
      </button>
      <a href="{% url 'teacher_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
