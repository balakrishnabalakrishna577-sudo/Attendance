<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <title>Login — Attendance System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

{% if messages %}
<div class="alert-container">
  {% for message in messages %}
    <div class="toast-alert toast-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
      <i class="bi bi-{% if message.tags == 'error' %}x-circle-fill{% elif message.tags == 'success' %}check-circle-fill{% else %}info-circle-fill{% endif %}"></i>
      <span>{{ message }}</span>
      <button class="toast-close">×</button>
    </div>
  {% endfor %}
</div>
{% endif %}

<div class="login-page">
  <div class="login-card">

    <div class="login-logo" aria-hidden="true">
      <i class="bi bi-mortarboard-fill"></i>
    </div>

    <div class="login-title">
      <h1>Attendance System</h1>
      <p>Sign in to continue</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label-custom" for="username">
          <i class="bi bi-person me-1"></i> Username
        </label>
        <input type="text" id="username" name="username"
               class="form-control-custom"
               placeholder="Enter your username"
               autocomplete="username"
               autocapitalize="none"
               required>
      </div>

      <div class="mb-4">
        <label class="form-label-custom" for="password">
          <i class="bi bi-lock me-1"></i> Password
        </label>
        <div style="position:relative;">
          <input type="password" id="password" name="password"
                 class="form-control-custom"
                 placeholder="Enter your password"
                 autocomplete="current-password"
                 required
                 style="padding-right:2.75rem;">
          <button type="button" id="pwd-toggle" aria-label="Toggle password visibility"
                  style="position:absolute;right:.7rem;top:50%;transform:translateY(-50%);
                         background:none;border:none;cursor:pointer;color:#64748b;padding:.2rem;">
            <i class="bi bi-eye" id="pwd-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:.7rem;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% load static %}
<script src="{% static 'js/app.js' %}"></script>
<script>
  document.getElementById('pwd-toggle').addEventListener('click', function () {
    var inp  = document.getElementById('password');
    var icon = document.getElementById('pwd-icon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  });
</script>
</body>
</html>
